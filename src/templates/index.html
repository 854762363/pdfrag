<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFRAG - 文档智能问答</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin: 30px 0 10px; color: #1a1a2e; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #555; }
        input, textarea, button { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: #4361ee; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #3a56d4; }
        button:disabled { background: #999; cursor: not-allowed; }
        #uploadStatus, #chatStatus { font-size: 13px; margin-bottom: 10px; min-height: 20px; }
        .success { color: #2d8a4e; }
        .error { color: #d32f2f; }
        .answer-box { background: #f0f7ff; border: 1px solid #cce5ff; border-radius: 8px; padding: 16px; margin-top: 12px; white-space: pre-wrap; line-height: 1.6; }
        .source-item { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 13px; }
        .source-meta { color: #888; font-size: 12px; }
        hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        .api-hint { font-size: 12px; color: #999; text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 PDFRAG</h1>
    <p class="subtitle">上传 PDF 文档，智能问答</p>

    <!-- Upload -->
    <div class="card">
        <h2>📤 上传文档</h2>
        <input type="file" id="fileInput" accept=".pdf">
        <button id="uploadBtn" onclick="uploadPDF()">上传并处理</button>
        <div id="uploadStatus"></div>
    </div>

    <!-- Chat -->
    <div class="card">
        <h2>💬 文档问答</h2>
        <label>文档 ID</label>
        <input type="text" id="docId" placeholder="自动填入，也可手动指定">
        <label>会话 ID</label>
        <input type="text" id="convId" value="default" placeholder="conversation id">
        <label>问题</label>
        <textarea id="question" placeholder="输入你的问题..."></textarea>
        <button id="chatBtn" onclick="askQuestion()">提问</button>
        <div id="chatStatus"></div>
        <div id="answerArea"></div>
    </div>

    <p class="api-hint">API: GET /health | POST /upload | POST /chat</p>
</div>

<script>
async function uploadPDF() {
    const file = document.getElementById('fileInput').files[0];
    const status = document.getElementById('uploadStatus');
    if (!file) { status.innerHTML = '<span class="error">请选择 PDF 文件</span>'; return; }

    status.textContent = '上传中...';
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;

    const form = new FormData();
    form.append('file', file);

    try {
        const res = await fetch('/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (data.status === 'error') {
            status.innerHTML = `<span class="error">${data.message}</span>`;
        } else {
            status.innerHTML = `<span class="success">✅ ${data.filename} | ${data.pages} 页 | ${data.chunks} 块 | ID: ${data.doc_id}</span>`;
            document.getElementById('docId').value = data.doc_id;
        }
    } catch (e) {
        status.innerHTML = `<span class="error">上传失败: ${e.message}</span>`;
    }
    btn.disabled = false;
}

async function askQuestion() {
    const question = document.getElementById('question').value.trim();
    const docId = document.getElementById('docId').value.trim();
    const convId = document.getElementById('convId').value.trim();
    const status = document.getElementById('chatStatus');
    const answerArea = document.getElementById('answerArea');

    if (!question) { status.innerHTML = '<span class="error">请输入问题</span>'; return; }

    status.textContent = '查询中...';
    const btn = document.getElementById('chatBtn');
    btn.disabled = true;
    answerArea.innerHTML = '';

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, conversation_id: convId, doc_id: docId || null })
        });
        const data = await res.json();
        status.textContent = data.confidence ? `置信度: ${(data.confidence*100).toFixed(0)}%` : '';

        let html = `<div class="answer-box">${escapeHtml(data.answer)}</div>`;
        if (data.sources && data.sources.length > 0) {
            html += '<h3 style="margin-top:16px">📚 来源</h3>';
            data.sources.forEach(s => {
                html += `<div class="source-item">
                    <strong>第${s.page}页</strong> ${escapeHtml(s.section)}
                    <div class="source-meta">${escapeHtml(s.content_preview || '')} | 相关度: ${(s.score*100).toFixed(0)}%</div>
                </div>`;
            });
        }
        answerArea.innerHTML = html;
    } catch (e) {
        status.innerHTML = `<span class="error">查询失败: ${e.message}</span>`;
    }
    btn.disabled = false;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
